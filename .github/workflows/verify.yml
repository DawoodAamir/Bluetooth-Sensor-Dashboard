name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core behavior
        run: swift test
      - name: Build iOS application
        run: xcodebuild -project "Bluetooth Sensor Dashboard.xcodeproj" -scheme "Bluetooth Sensor Dashboard" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
